name: CI

on:
  schedule:
    - cron: '0 0 * * 4'
  push:
    branches:
      - main
      - develop
      - release-*
  pull_request:
    branches:
      - main
      - develop
      - release-*
  workflow_dispatch:

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install requirements
      run: python install.py
    - name: Run flake8
      run: invoke lint
    - name: Run black
      run: invoke format
    - name: Run docs
      run: invoke docs
  Test:
    strategy:
      matrix:
        python_version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install requirements
        run: python install.py
      - name: Run tests
        run: invoke test
  Test-Minimum-Versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set requirements to minimum
        run: sed -i 's/>=/==/g' requirements.txt
      - name: Set optional dependencies (setup.py extras) to minimum
        # Only rewrites '>=' that follows a quoted package name, e.g. "pandas>=1.5,<3" -> "pandas==1.5,<3",
        # so python_requires=">=3.10" is left alone.
        run: sed -i -E 's/"([][A-Za-z0-9_.-]+)>=/"\1==/g' setup.py
      - name: Install requirements
        run: python install.py
      - name: Run tests
        run: invoke test
  Test-Windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python_version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install requirements
        run: python install.py
      - name: Run tests
        run: python -m pytest
  Test-Core-Dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Import tamr_toolbox
        run: python -c 'import tamr_toolbox'
  Enforce-Test-Coverage:
    runs-on: ubuntu-latest
    env:
      COVERAGE_SINGLE: 0
      COVERAGE_TOTAL: 27
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python install.py
      - name: pytester-cov
        id: pytester-cov
        uses: programmingwithalex/pytester-cov@main
        with:
          pytest-root-dir: '.'
          cov-omit-list: 'examples/*, doc_src/*, tests/*, install.py, setup.py, tasks.py'
          cov-threshold-single: ${{ env.COVERAGE_SINGLE }}
          cov-threshold-total: ${{ env.COVERAGE_TOTAL }}
      - name: Coverage single fail - exit
        if: ${{ steps.pytester-cov.outputs.cov-threshold-single-fail == 'true' }}
        run: |
          echo "cov single fail ${{ steps.pytester-cov.outputs.cov-threshold-single-fail }}"
          echo "coverage table ${{ steps.pytester-cov.outputs.output-table }}"
          exit 1
      - name: Coverage total fail - exit
        if: ${{ steps.pytester-cov.outputs.cov-threshold-total-fail == 'true' }}
        run: |
          echo "cov total fail ${{ steps.pytester-cov.outputs.cov-threshold-total-fail }}"
          echo "coverage table ${{ steps.pytester-cov.outputs.output-table }}"
          exit 1
  Notify:
    needs:  # List of all preceding jobs
      - Lint
      - Test
      - Test-Minimum-Versions
      - Test-Windows
      - Test-Core-Dependencies
      - Enforce-Test-Coverage
    if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }} # Notify on failed scheduled runs only
    runs-on: ubuntu-latest
    permissions:
      actions: 'read'
    steps:
    - name: Slack Workflow Notification
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
              "text": "Scheduled GitHub CI result", 
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "${{ contains(needs.*.result, 'failure')  && '\u274C' || '\u2705' }} Scheduled GitHub CI: ${{ contains(needs.*.result, 'failure')  && '*Failure*' || '*Success*!' }}\nhttps://github.com/${{github.repository}}/actions/runs/${{github.run_id}}"
                      }
                  }
              ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.TBOX_SLACK_WEBHOOK }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    


